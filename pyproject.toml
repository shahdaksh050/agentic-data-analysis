[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-analysis"
version = "1.0.0"
description = "Autonomous AI-Powered Data Analysis System with RLM Inference"
readme = "README.md"
requires-python = ">=3.11"

# ==============================================================
# RUFF — Linting Configuration
# ==============================================================
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "N", "B", "C4", "RUF"]
# E501: line length handled by formatter; B008: function-call defaults are intentional;
# RUF001/2/3: typographic ×, –, ↔, α in user-facing strings are deliberate.
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# sklearn convention: feature matrix is named X (N803/N806)
"src/tools/ml_pipeline.py" = ["N803", "N806"]
"src/tools/visualization.py" = ["N806"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================
# MYPY — Type Checking Configuration
# ==============================================================
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
exclude = ["tests/", "output/"]

# ==============================================================
# PYTEST — Test Configuration
# ==============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
addopts = "-v --tb=short"
