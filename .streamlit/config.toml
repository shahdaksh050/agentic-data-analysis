# Theme — "Ledger" (see DESIGN.md)
# Warm paper, friendly ink, one terracotta pen for actions, one soft red for warnings.

[theme]
base = "light"
primaryColor = "#A34F20"                      # Terracotta pen — buttons, links, the agent's own marks
backgroundColor = "#F7EEDD"                   # Warm cream — the page itself
secondaryBackgroundColor = "#FFFBF2"          # Lifted card — panels and tiles
textColor = "#3A2B1E"                         # Warm ink
linkColor = "#A34F20"
borderColor = "#E4D4BC"                       # Soft tan hairline
codeBackgroundColor = "#F1E4CB"
font = "Mukta, 'Segoe UI', sans-serif"
headingFont = "'Baloo 2', 'Mukta', 'Segoe UI', sans-serif"
codeFont = "'Cascadia Code', Consolas, monospace"
baseRadius = "14px"                           # Warm and rounded, not drafted
buttonRadius = "999px"
dataframeBorderColor = "#E4D4BC"
dataframeHeaderBackgroundColor = "#F1E4CB"
chartCategoricalColors = ["#A34F20", "#A33526", "#C08A2E", "#5B8C5A", "#8A7660", "#B5714A"]
