# Theme — "Drafting Table" (see DESIGN.md)
# Mineral drafting stock, ink linework, two plotter pens: blue measures, red warns.

[theme]
base = "light"
primaryColor = "#12467E"                      # Measurement pen — the agent's own marks
backgroundColor = "#DCDBD3"                   # Mineral stock — the drafting sheet
secondaryBackgroundColor = "#EFEEE8"           # Lifted sheet — plates and panels
textColor = "#171C1F"                         # Drawing ink
linkColor = "#12467E"
borderColor = "#B6B4A9"                       # Ruled hairline
codeBackgroundColor = "#E4E3DC"
font = "Archivo, 'Segoe UI', sans-serif"
headingFont = "Archivo, 'Segoe UI', sans-serif"
codeFont = "'IBM Plex Mono', 'Cascadia Code', Consolas, monospace"
baseRadius = "0px"                            # Nothing that carries data is rounded
buttonRadius = "0px"
dataframeBorderColor = "#B6B4A9"
dataframeHeaderBackgroundColor = "#E4E3DC"
chartCategoricalColors = ["#12467E", "#B5271A", "#7A8B99", "#C08A2E", "#3F6F5B", "#8E6E9E"]
